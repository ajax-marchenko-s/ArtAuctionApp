name: Checkout@v4
description: Proxy for actions/checkout@v4

inputs:
  action-name:
    required: true
    description: action to call

  action-inputs:
    description: inputs for action
    required: true


#outputs:
#  result:
#    description: 'all outputs'
#    value: ${{ steps.set-outputs.outputs.result }}


runs:
  using: "composite"
  steps:

    - name: Upload file to S3
      shell: bash
      run: |
        echo Inputs inside proxy action
        "echo action name ${{ inputs.action-name }}"
        "echo action inputs ${{ inputs.action-inputs }}"

    - name: Proxy
      id: proxy
      uses: "${{ inputs.action-name }}"
      with: ${{ fromJSON(inputs.action-inputs) }}

