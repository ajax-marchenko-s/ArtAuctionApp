name: Playground for Svitlana Marchenko
run-name: SMarchenko Workflow experiments

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'

jobs:
  test-gha:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: my action
        id: my-action
        uses: ./smarchenko-proxy
        with:
          s3-destination-path: 'my test'
#          test-name: 'my test name'
#          file-path: 'my file path'

      - name: my-result
        shell: bash
        run: |
          echo 'Outputs inside workflows'
          echo 'ref ${{ steps.my-action.outputs.ref }}'
          echo 'commit ${{ steps.my-action.outputs.commit }}'
