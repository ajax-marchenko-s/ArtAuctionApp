name: Playground for Svitlana Marchenko
run-name: SMarchenko Workflow experiments

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'

jobs:
  test-gha:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: my action with proxy
        id: my-action-with-proxy
        uses: ./my-proxy
#        secrets: inherit
        with:
          uses: './smarchenko'
          with: '{}'

      - name: my action with proxy outputs
        shell: bash
        run: |
          echo 'My action with proxy outputs ${{ steps.my-action-with-proxy.outputs.outputs }}'
