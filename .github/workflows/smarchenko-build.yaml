#        with:
#          action-name: './smarchenko'
#          action-inputs: >
#            {
#                "s3-destination-path":"some-value-1"
#            }

      - name: my action
        id: my-action
        uses: jenseng/dynamic-uses@v1
        with:
          uses: Kaven-Universe/github-action-current-date-time@v1
          with: '{"format": "YYYY-MM-DD"}'

      - name: my action result
        shell: bash
        run: |
          echo 'Outputs ${{ steps.my-action.outputs.outputs }}'

