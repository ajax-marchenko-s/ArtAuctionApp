name: Playground for Svitlana Marchenko
run-name: SMarchenko Workflow experiments

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'

jobs:
  test-gha:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: my action
        id: my-action
        uses: ./smarchenko-proxy
        with:
          s3-destination-path: 'test'

      - name: my-result
        shell: bash
        run: |
          echo ref ${{ needs.my-action.outputs.ref }}
          echo commit ${{ needs.my-action.outputs.commit }}
