name: Playground for Svitlana Marchenko
run-name: SMarchenko Workflow experiments

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '**'

jobs:
  test-gha:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: my action
        id: my-action
        uses: jenseng/dynamic-uses@v1
        with:
          uses: Kaven-Universe/github-action-current-date-time@v1
          with: '{"format": "YYYY-MM-DD"}'

      - name: my action with proxy
        id: my-action-with-proxy
        uses: ./my-proxy
        with:
          uses: 'Kaven-Universe/github-action-current-date-time@v1'
          with: '{"format": "DD-MM-YYYY"}'

      - name: my action outputs
        shell: bash
        run: |
          echo 'My action outputs ${{ steps.my-action.outputs.outputs }}'

      - name: my action with proxy outputs
        shell: bash
        run: |
          echo 'My action with proxy outputs ${{ steps.my-action-with-proxy.outputs.outputs }}'

